apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: mediqueue
  labels:
    app: broken-image-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: demo
          image: nginx:this-tag-does-not-exist
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
