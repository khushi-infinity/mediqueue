backend:
  repository: ghcr.io/khushi-infinity/mediqueue-backend
  tag: local
  replicas: 2
frontend:
  repository: ghcr.io/khushi-infinity/mediqueue-frontend
  tag: local
  replicas: 2
imagePullPolicy: IfNotPresent
imagePullSecrets: []
database:
  image: postgres:17-alpine
  existingSecret: mediqueue-db
  storageClass: ""
  size: 2Gi
ingress:
  enabled: true
  className: traefik
  host: mediqueue.localhost
  tlsSecret: ""
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70
monitoring:
  enabled: true
  prometheusImage: prom/prometheus:v3.2.1
  grafanaImage: grafana/grafana:11.6.0
  grafanaSecret: mediqueue-grafana
  nodePorts: false
