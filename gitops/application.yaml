apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediqueue
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/khushi-infinity/mediqueue.git
    targetRevision: main
    path: helm/mediqueue
    helm:
      releaseName: mediqueue
      valueFiles: [values-local.yaml, values-release.json]
  destination:
    server: https://kubernetes.default.svc
    namespace: mediqueue
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
  # Preserve the replica count managed by the HorizontalPodAutoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers: [/spec/replicas]
