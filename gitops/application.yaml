apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediqueue
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/khushi-infinity/mediqueue.git
    targetRevision: main
    path: helm/mediqueue
    helm:
      releaseName: mediqueue
      # Later files win. The CI-promoted release is the base, and the local
      # overlay is applied last so a local cluster uses the images that were
      # loaded with `kind load docker-image` instead of registry digests.
      # On AWS, replace values-local.yaml with values-aws.yaml.
      valueFiles: [values-release.json, values-local.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: mediqueue
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
  # Preserve the replica count managed by the HorizontalPodAutoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers: [/spec/replicas]
